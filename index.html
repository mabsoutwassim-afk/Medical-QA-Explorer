<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical QA Dataset Quiz</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #f43f5e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin: 0;
            color: #0369a1;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0f2fe;
        }

        .timer {
            color: var(--danger);
            background: #ffe4e6;
            padding: 4px 12px;
            border-radius: 9999px;
        }

        .box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        /* Essential for mobile devices to handle long text */
        .scrollable {
            max-height: 250px;
            overflow-y: auto;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        #response-container {
            display: none;
            border-color: #6ee7b7;
            background: #ecfdf5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:active { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--success); color: white; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Medical QA Explorer</h1>
        
        <div class="status-bar">
            <span id="loading-status">Loading dataset...</span>
            <span class="timer" id="timer-display">45s</span>
        </div>

        <div class="box scrollable" id="question-container">
            <div class="label">Question</div>
            <div id="question-text">Connecting to Hugging Face...</div>
        </div>

        <div class="box scrollable" id="response-container">
            <div class="label">Response</div>
            <div id="response-text"></div>
        </div>

        <button class="btn-primary" id="show-btn" onclick="showAnswer()" disabled>Show Answer</button>
        <button class="btn-secondary" id="next-btn" onclick="loadRandomQuestion()">Next Question</button>
    </div>

    <script>
        // API Endpoint for Starlord1010/Medical-QA-dataset
        const API_URL = "https://datasets-server.huggingface.co/rows?dataset=Starlord1010/Medical-QA-dataset&config=default&split=train&offset=0&length=100";
        
        let datasetRows = [];
        let currentTimer = null;
        let timeLeft = 45; // 45 seconds timer

        // UI Elements
        const questionEl = document.getElementById('question-text');
        const responseContainer = document.getElementById('response-container');
        const responseEl = document.getElementById('response-text');
        
        const timerDisplay = document.getElementById('timer-display');
        const showBtn = document.getElementById('show-btn');
        const nextBtn = document.getElementById('next-btn');
        const loadingStatus = document.getElementById('loading-status');

        async function fetchDataset() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                datasetRows = data.rows; 
                loadingStatus.innerText = "Ready!";
                loadRandomQuestion();
            } catch (error) {
                loadingStatus.innerText = "Error!";
                questionEl.innerText = "Failed to load the dataset. Please check your internet connection.";
            }
        }

        function loadRandomQuestion() {
            if (datasetRows.length === 0) return;

            // Reset UI for the new question
            clearInterval(currentTimer);
            responseContainer.style.display = 'none';
            showBtn.style.display = 'block';
            showBtn.disabled = false;
            nextBtn.style.display = 'none';
            
            timeLeft = 45;
            timerDisplay.innerText = `${timeLeft}s`;

            // Pick a random row
            const randomIndex = Math.floor(Math.random() * datasetRows.length);
            const rowData = datasetRows[randomIndex].row;

            // Map dataset columns (question and response)
            questionEl.innerText = rowData.question || "No question provided.";
            responseEl.innerText = rowData.response || "No response provided.";

            // Reset scroll positions to the top
            document.querySelectorAll('.scrollable').forEach(el => el.scrollTop = 0);

            startTimer();
        }

        function startTimer() {
            currentTimer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    showAnswer();
                }
            }, 1000);
        }

        function showAnswer() {
            clearInterval(currentTimer);
            timerDisplay.innerText = "Time's up!";
            
            // Reveal the response and swap buttons
            responseContainer.style.display = 'block';
            showBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        }

        // Initialize
        fetchDataset();
    </script>
</body>
</html>
